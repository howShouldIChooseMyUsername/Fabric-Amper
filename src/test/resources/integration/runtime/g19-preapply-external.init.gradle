initscript {
    repositories {
        maven { url = uri('https://maven.fabricmc.net/') }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'net.fabricmc:fabric-loom:1.18.4'
    }
}

// Preapply the real external binary to the isolated root Project before
// the settings-only Fabric Amper Project plugin can configure its own Loom.
// Strict CodeSource checks prevent classloader shadowing by bundled 1.17.21.
def externalClass = this.class.classLoader.loadClass('net.fabricmc.loom.LoomGradlePlugin')
def actualSource = externalClass.protectionDomain.codeSource.location.toString()
println('G19_EXTERNAL_CLASS_SOURCE=' + actualSource)
if (!actualSource.contains('1.18.4')) {
    throw new GradleException('G19_INVALID_SETUP: external Loom class source is not 1.18.4: ' + actualSource)
}

gradle.beforeProject { project ->
    if (project.path == ':') {
        println('G19_EXTERNAL_CLASS_VERSION_CONFIRMED=1.18.4')
        project.pluginManager.apply(externalClass)
        def instance = project.plugins.findPlugin(externalClass)
        if (instance == null || project.extensions.findByName('loom') == null) {
            throw new GradleException('G19_INVALID_SETUP: external Loom plugin or extension did not exist')
        }
        def instanceSource = instance.class.protectionDomain.codeSource.location.toString()
        println('G19_APPLIED_PLUGIN_CLASS_SOURCE=' + instanceSource)
        if (!instanceSource.contains('1.18.4')) {
            throw new GradleException('G19_INVALID_SETUP: applied plugin instance came from another Loom version: ' + instanceSource)
        }
        println('G19_REAL_EXTERNAL_LOOM_APPLIED=1.18.4')
    }
}
