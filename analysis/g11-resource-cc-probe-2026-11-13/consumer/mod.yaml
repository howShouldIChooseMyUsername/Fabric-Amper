schema: 1
product: fabric/mod
mod:
  id: testkit_mod
  version: "1.0.0+26.3"
  group: org.example
  archivesName: testkit-mod
  name: "Fabric Amper TestKit Mod"
  environment: "*"
  mixins:
    - example.mixins.json
  accessWidener: example.classtweaker
  icon: assets/testkit_mod/icon.png
  entrypoints:
    main:
      - org.example.TestkitEntry
minecraft:
  version: "26.3"
  mappings: mojang
  loader: "0.20.1"
  fabricApi: "0.165.2+26.3"
settings:
  java:
    release: 25
    sourcesJar: true
  kotlin:
    enabled: false
  loom:
    splitEnvironmentSourceSets: false
  resources:
    failOnExistingFabricModJson: true
repositories:
  - fabric
  - mavenCentral
