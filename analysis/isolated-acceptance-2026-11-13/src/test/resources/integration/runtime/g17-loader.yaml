schema: 1
product: fabric/mod
mod:
  id: amper_rt_g17
  version: "0.1.0+26.3"
  group: org.example.runtime
  archivesName: amper-rt-g17
  environment: "*"
  entrypoints:
    main:
      - org.example.runtime.G17Main
    client:
      - org.example.runtime.G17Client
  accessWidener: g17.classtweaker
  custom:
    "loom:injected_interfaces":
      "net/minecraft/world/item/ItemStack":
        - "org/example/runtime/G17Injected"
minecraft:
  version: "26.3"
  mappings: mojang
  loader: "0.20.1"
  fabricApi: "0.165.2+26.3"
settings:
  java:
    release: 25
    sourcesJar: false
  kotlin:
    enabled: false
  loom:
    splitEnvironmentSourceSets: true
  resources:
    failOnExistingFabricModJson: true
repositories:
  - fabric
  - mavenCentral
